- slug: lingdoc
  name: 灵档 LingDoc
  status: wip
  year: 2026
  month: 08
  desc: 大创项目——个人文档 AI 知识库。文件夹变成可对话的库：AI 智能规整、知识问答、表格自动填写、混合检索、关系图谱。
  tags: [Electron, React, Spring Boot, FastAPI, RAG, 大创]
  story:
    - 灵档想解决一个具体的问题：个人文档散在文件夹里，找起来靠回忆，用起来靠肉眼。它把文件夹变成可对话的知识库——丢进去的文档自动被理解、分类、打标签，之后可以直接提问，像和一个知道所有文件内容的人在聊天。
    - 架构上分成三层：Electron + React 的桌面客户端负责界面，Spring Boot + SQLite 的本地服务管数据，Python FastAPI + Celery 的 AI 服务处理规整与问答。三层本地部署，检索走全文 + 向量 + BM25 的混合策略。
    - 这是我现在投入最多的项目，作为大创课题持续迭代中。
  highlights:
    - 多仓库 Vault 文件库：拖拽上传、文件夹同步、版本历史
    - AI 智能规整：自动生成摘要、关键词、分类标签
    - 知识问答支持多轮工具调用，表格填写可基于模板 + 参考文档自动填充
    - 三层服务本地运行，混合检索（全文 + 语义 + BM25）
  stack: [Electron, React, Vite, Tailwind, Java, Spring Boot, MyBatis, SQLite, Python, FastAPI, Celery, Redis]

- slug: coderadar
  name: CodeRadar
  status: shipped
  year: 2026
  month: 06
  desc: 智能体实训项目——AI 编程助手竞品分析系统。采集竞品多源数据，Mini-RAG 混合检索 + LangChain Multi-Agent 生成情报卡片与能力快照。
  tags: [Python, LangChain, FastAPI, Elasticsearch, Vue, RAG]
  story:
    - CodeRadar 是智能体实训四周的产物：给 AI 编程助手（Cursor、GitHub Copilot、Trae、通义灵码、CodeGeeX）建一套竞品分析系统。数据从多源采集，清洗、标注、版本化后进 Mini-RAG 索引，检索结果可追溯、可验证。
    - 分析层由 LangChain Multi-Agent 承担：一个 Agent 产出情报卡片，一个做 D1-D7 能力快照，一个生成基准对比与 Markdown 简报。前端是 Vue 3，三个服务用 docker-compose 编排。
    - 实训四周围绕「数据 -> 检索 -> Agent -> 交付物」的完整闭环推进，最后一周补上 SQLite 持久化、异步工作流和带认证限流的正式 API。
  highlights:
    - Mini-RAG 混合检索，证据可溯源、可验证
    - LangChain Multi-Agent 分工产出情报卡片、能力快照与基准对比
    - 第四周落地正式 API：API-Key 认证、限流、审计
    - Vue 3 前端 + Elasticsearch / API / Worker 三服务 docker-compose
  stack: [Python, FastAPI, LangChain, Elasticsearch, SQLite, Alembic, Celery, Vue 3, Docker]
  links:
    repo: https://github.com/magician336/competitor-analysis-system

- slug: huabu
  name: 画布 huabu-front
  status: shipped
  year: 2025
  month: 12
  desc: 仿 Excalidraw 的 Web 画布绘图应用，Vue 3 + 原生 Canvas 实现，支持协同编辑与离线编辑。
  tags: [Vue 3, Canvas, Socket.IO, 前端]
  story:
    - 前端实训营的课题作业：从零写一个画布类产品。约束是只能用原生 Canvas API，不能用 konva、tldraw 这类现成库——正好逼着自己把画布底层的渲染、命中和变换逻辑摸了一遍。
    - 功能最后远超课题 P0 要求：无限画布带小地图、自定义滚动条、辅助线对齐、多元素打组、undo/redo；P1 级的协同编辑用 Socket.IO 实现，断网时切到离线模式，网络恢复后自动提交。
    - 一个月 35 次提交，从空白页面到一个能协同画图的完整应用。
  highlights:
    - 原生 Canvas 实现图形/图片/富文本绘制与编辑，无第三方绘图库
    - 无限画布：minimap 小地图、辅助线、多元素打组、undo/redo
    - Socket.IO 协同编辑 + 断网离线编辑、恢复后自动提交
    - 附带 AI 生图功能
  stack: [Vue 3, Vite, Canvas, Socket.IO, Express]
  links:
    repo: https://gitee.com/jie1015034983/huabu-front

