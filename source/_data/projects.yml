- slug: milktea
  name: 奶茶店管理系统
  status: shipped
  year: 2026
  month: 06
  desc: 数据库系统课设——基于若依框架二次开发的奶茶门店后台，存储过程、触发器、视图全部真实接入 Java 层。
  tags: [Spring Boot, MyBatis, MySQL, 数据库]
  story:
    - 数据库系统课设，要求不只是在课堂上建两张表——我把「奶茶店管理」做成一个能跑的完整系统：基于若依（RuoYi）单体框架二次开发，业务覆盖分类、商品、员工、库存、订单的完整管理闭环。
    - 数据库是这门课的主角：7 张业务表用 PowerDesigner 建模，写了带事务保护级联删除的存储过程、自动结算订单金额的存储过程、库存不足自动报错的触发器，以及 5 表关联的视图——并且全部真实接进 Java 层的 Controller，不是建完表就完事。
  highlights:
    - 7 张业务表 PowerDesigner 建模，含 E-R 设计文档
    - 存储过程：事务级联删除、三表 JOIN 自动结算；触发器：库存校验与自动扣减；视图：5 表关联综合查询
    - 7 个 CRUD 业务模块 + 菜单/按钮级权限配置，带 Excel 导出
  stack: [Spring Boot, MyBatis, MySQL, Shiro, Thymeleaf, PowerDesigner]
