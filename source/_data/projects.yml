    - 数据库系统课设，要求不只是在课堂上建两张表——我把「奶茶店管理」做成一个能跑的完整系统：基于若依（RuoYi）单体框架二次开发，业务覆盖分类、商品、员工、库存、订单的完整管理闭环。
