    - 一个月 35 次提交，从空白页面到一个能协同画图的完整应用。
  highlights:
    - 原生 Canvas 实现图形/图片/富文本绘制与编辑，无第三方绘图库
    - 无限画布：minimap 小地图、辅助线、多元素打组、undo/redo
    - Socket.IO 协同编辑 + 断网离线编辑、恢复后自动提交
    - 附带 AI 生图功能
  stack: [Vue 3, Vite, Canvas, Socket.IO, Express]
  links:
    repo: https://gitee.com/jie1015034983/huabu-front

